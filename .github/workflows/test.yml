name: Test

on:
  push:
    branches: [main, init]
  pull_request:
    branches: [main, init]

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Type check
        run: pnpm typecheck

      - name: Run tests with coverage
        run: pnpm test:coverage

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: coverage/

  e2e-tests:
    name: E2E Tests (Maestro)
    runs-on: macos-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH

      - name: Start iOS Simulator
        uses: futureware-tech/simulator-action@v3
        with:
          model: 'iPhone 16'
          os_version: '18'

      - name: Cache Expo Go
        id: cache-expo-go
        uses: actions/cache@v4
        with:
          path: ~/expo-go-cache
          key: expo-go-ios-sdk54

      - name: Download Expo Go
        if: steps.cache-expo-go.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/expo-go-cache
          # Download Expo Go for iOS Simulator (SDK 54)
          curl -L "https://dpq5q02fu5f55.cloudfront.net/Exponent-2.33.0.tar.gz" -o ~/expo-go-cache/ExpoGo.tar.gz
          cd ~/expo-go-cache && tar -xzf ExpoGo.tar.gz

      - name: Install Expo Go on Simulator
        run: |
          xcrun simctl install booted ~/expo-go-cache/Exponent.app

      - name: Start Expo
        run: |
          npx expo start --ios --no-dev &
          sleep 90

      - name: Run E2E Tests
        run: maestro test .maestro/
        continue-on-error: true

      - name: Upload E2E Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-results
          path: ~/.maestro/tests/
