packages: []

allowBuilds:
  esbuild: true

# Force patched versions of vulnerable transitive dependencies (Dependabot alerts).
# Range selectors target only the vulnerable instances and stay within a compatible
# major line to avoid breaking the packages that pull them in.
overrides:
  "shell-quote@<1.8.4": ">=1.8.4"
  "minimatch@<3.1.4": ">=3.1.4 <4"
  "brace-expansion@<1.1.13": ">=1.1.13 <2"
  "yaml@<2.8.3": ">=2.8.3 <3"
  "ws@>=8.0.0 <8.21.0": ">=8.21.0 <9"
  "ws@>=7.0.0 <7.5.11": ">=7.5.11 <8"
  "undici@>=7.0.0 <7.28.0": ">=7.28.0 <8"
  "undici@>=6.0.0 <6.27.0": ">=6.27.0 <7"
  "vite": ">=7.3.5 <8"
  "esbuild@<0.28.1": ">=0.28.1 <0.29"
  "@babel/core@<7.29.6": ">=7.29.6 <8"
  "lodash-es@<4.18.0": ">=4.18.0 <5"
  "uuid@<11.1.1": ">=11.1.1 <12"
