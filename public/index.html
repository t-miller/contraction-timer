          "@type": "Question",
          "name": "How do I use a contraction timer?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Tap the Start button when a contraction begins, then tap Stop when it ends. The timer records the duration of each contraction and the interval between them. Review your history to see the pattern of your contractions over time."

        },
        {
          "@type": "Question",
          "name": "What does a contraction timer track?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "A contraction timer tracks two things: duration (how long each contraction lasts from start to stop) and frequency (the time between the start of one contraction and the start of the next). These measurements help you understand your contraction pattern."

        },

          "name": "Is this contraction timer free?",
